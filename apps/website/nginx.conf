server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name kurobara.systems _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  include /etc/nginx/security-headers.conf;

  if ($request_uri ~ "^//") {
    return 308 https://kurobara.systems/;
  }

  location = / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location = /healthz {
    access_log off;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow" always;
    default_type text/plain;
    try_files $uri =404;
  }

  location = /index.html {
    return 308 https://kurobara.systems/;
  }

  location = /robots.txt {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=300";
    default_type text/plain;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=300";
    default_type application/xml;
    try_files $uri =404;
  }

  location = /site.webmanifest {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location = /favicon.svg {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location = /assets/kurobara-rose.webp {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location = /assets/social/og-kurobara.jpg {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location ^~ /licenses/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Robots-Tag "noindex, nofollow" always;
    default_type text/plain;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|jpe?g|woff2?|png|svg|webmanifest|webp)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri =404;
  }
}

server {
  listen 8080;
  listen [::]:8080;
  server_name www.kurobara.systems;

  server_tokens off;
  include /etc/nginx/security-headers.conf;

  return 308 https://kurobara.systems$request_uri;
}
