services:
  kurobara-postgres:
    # Isolated application database for the complete worker qualification.
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    environment:
      POSTGRES_DB: kurobara
      POSTGRES_PASSWORD: ${KUROBARA_POSTGRES_PASSWORD:?set KUROBARA_POSTGRES_PASSWORD}
      POSTGRES_USER: kurobara
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d kurobara -U kurobara"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    ports:
      - "127.0.0.1:${KUROBARA_POSTGRES_PORT:-54329}:5432"
    restart: unless-stopped
    tmpfs:
      - /var/lib/postgresql/data

  postgres:
    # PostgreSQL 17 matches Hatchet's official local Docker driver.
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: hatchet
      POSTGRES_PASSWORD: ${HATCHET_POSTGRES_PASSWORD:?set HATCHET_POSTGRES_PASSWORD}
      POSTGRES_USER: hatchet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d hatchet -U hatchet"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  hatchet:
    # Candidate v0.95.3 adds the server-side idempotency used by SDK 1.28.0.
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite-dev:v0.95.3@sha256:059e79e7f5044581cd2394b5b4212b0911642ed5486662c4a637d0bcf028ecdc
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hatchet:${HATCHET_POSTGRES_PASSWORD:?set HATCHET_POSTGRES_PASSWORD}@postgres:5432/hatchet?sslmode=disable
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "true"
      SERVER_AUTH_SET_EMAIL_VERIFIED: "true"
      SERVER_DEFAULT_ENGINE_VERSION: V1
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:${HATCHET_GRPC_PORT:-7077}
      SERVER_GRPC_INSECURE: "true"
      SERVER_GRPC_PORT: "7077"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_URL: http://localhost:${HATCHET_DASHBOARD_PORT:-8888}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8733/ready >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    ports:
      - "127.0.0.1:${HATCHET_DASHBOARD_PORT:-8888}:8888"
      - "127.0.0.1:${HATCHET_GRPC_PORT:-7077}:7077"
    restart: unless-stopped
    volumes:
      - hatchet-config:/config

volumes:
  hatchet-config:
  postgres-data:
